      buildset: 4cfc693c697945d39f438dfdaee28936
      change: '1006622'
      change_message: "Flush multipath maps by name, not by device path\n\nThe Fibre
        Channel connector flushes a volume's multipath map with\n\n    multipath -f
        /dev/disk/by-id/dm-uuid-mpath-<WWID>\n\nWhile multipathd is running that command
        does not flush locally; it\nforwards the request to the daemon as \"del map
        <arg>\".  Up to\nmultipath-tools 0.9.7 the daemon resolved <arg> through libdevmapper,\nwhich
        accepts any path.  Since 0.9.8 cli_del_map() looks the argument\nup with find_mp_by_str(),
        which accepts only a map name, alias, WWID\nor dm-N kernel name, so a by-id
        path comes back as -ENODEV and the\ncommand exits 1 with \"device not found\".
        \ The multipath client no\nlonger falls back to a local flush either.\n\nThe
        result on such a host is that every Fibre Channel detach fails:\nos-brick
        retries the flush three times over a minute, raises, and the\ncaller marks
        the operation failed even though the map was healthy and\nis removed by the
        multipathd \"del map\" that follows.  Creating a\nvolume from an image goes
        to error because copy_image_to_volume()\ncannot detach the destination, and
        Nova volume detaches fail the same\nway.  Observed on Ubuntu 26.04 (multipath-tools
        0.14.3, kernel 7.0) in\nthe Pure Storage third-party CI, where 26 of 26 cinder-volume
        flushes\nand 54 of 54 nova-compute flushes failed while the same job on Ubuntu\n24.04
        (multipath-tools 0.9.4) passed.  iSCSI is unaffected because\nremove_connection()
        already flushes by the name read from sysfs.\n\nAdd LinuxSCSI.get_multipath_map_name(),
        which turns a by-id symlink,\na /dev/mapper path or a dm-N node into the map
        name from\n/sys/block/dm-N/dm/name, and have flush_multipath_device() normalise\nits
        argument with it.  A plain name passes through unchanged.  If the\nmap has
        already gone and sysfs cannot answer, fall back to the WWID a\nby-id symlink
        encodes, or the basename of a /dev/mapper path, both of\nwhich multipathd
        resolves too.  No connector changes are needed.\n\nCloses-Bug: #2091104\nAssisted-By:
        Claude Code claude-fable-5-1\nChange-Id: I761914e53fb608467a02d0fb1ab80c582fd58d93\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\n"
