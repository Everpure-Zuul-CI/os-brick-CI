      branch: master
      build: ef94c32bb9a44f758389ff1b93dc4174
      buildset: effc8a6474bd46a98be4a51694714b10
      change: '1006622'
      change_message: "Resolve multipath map paths before flushing them\n\nThe Fibre
        Channel connector flushes a volume's multipath map with\n\n    multipath -f
        /dev/disk/by-id/dm-uuid-mpath-<WWID>\n\nWhile multipathd is running that command
        does not flush locally; it\nforwards the request to the daemon as \"del map
        <arg>\".  Up to\nmultipath-tools 0.9.7 the daemon resolved <arg> through libdevmapper,\nwhich
        accepts any path, and when that failed the multipath client fell\nback to
        a local flush.  Since multipath-tools 0.9.8 (released in 2024;\nthe Red Hat
        family ships the same code as device-mapper-multipath with\nthe same version
        numbers, so Fedora 42's 0.10.0 and later are affected\nas well as Ubuntu 26.04's
        0.14.3) cli_del_map() looks the argument up\nwith find_mp_by_str(), which
        accepts only a map name, alias, WWID or\ndm-N kernel name, so the by-id path
        comes back as -ENODEV and the\ncommand exits 1 with \"device not found\".
        \ The client no longer falls\nback to a local flush either.\n\nThe result
        on such a host is that every Fibre Channel detach fails:\nos-brick retries
        the flush three times over a minute, raises, and the\ncaller marks the operation
        failed even though the map was healthy and\nis removed by the multipathd \"del
        map\" that follows.  Creating a\nvolume from an image goes to error because
        copy_image_to_volume()\ncannot detach the destination, and Nova volume detaches
        fail the same\nway.  Observed on Ubuntu 26.04 (multipath-tools 0.14.3, kernel
        7.0) in\nthe Pure Storage third-party CI, where 26 of 26 cinder-volume flushes\nand
        54 of 54 nova-compute flushes failed while the same job on Ubuntu\n24.04 (multipath-tools
        0.9.4) passed.  iSCSI is unaffected because\nremove_connection() already flushes
        by the name read from sysfs.\n\nResolve any absolute path handed to flush_multipath_device()
        with\nos.path.realpath() before running the command, so the daemon receives\n/dev/dm-N.
        \ It strips the /dev/ prefix and accepts dm-N.  Daemons\nolder than 0.9.8
        reject dm-N, since libdevmapper treats it as a map\nname, but the multipath
        client of that era then flushes locally by\nthe full path, which is also how
        the by-id symlink has been working on\nthose versions all along, so their
        behaviour is unchanged.  A bare\nmap name, as passed by the iSCSI path, is
        used as is.\n\nThe three attempts move from the command to the method so that
        the\npath is resolved afresh on every attempt.  Device-mapper reuses a\nfreed
        minor number immediately, so a dm-N resolved once before the\nretries could
        name a different volume's map by the time a retry runs\nif the original map
        were removed in between.  The attempt count, the\n20 and 40 second waits and
        the per-attempt timeout are unchanged.\n\nCloses-Bug: #2167932\nAssisted-By:
        Claude Code claude-fable-5-1\nChange-Id: I761914e53fb608467a02d0fb1ab80c582fd58d93\nSigned-off-by:
        Simon Dodsley <simon@purestorage.com>\n"
