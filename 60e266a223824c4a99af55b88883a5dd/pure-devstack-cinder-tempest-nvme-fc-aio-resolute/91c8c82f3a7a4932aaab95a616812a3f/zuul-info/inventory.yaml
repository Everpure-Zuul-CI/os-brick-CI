      build: 91c8c82f3a7a4932aaab95a616812a3f
      buildset: 60e266a223824c4a99af55b88883a5dd
      change: '1013058'
      change_message: 'connectors/storpool.py: Try to get ID from ''volume_id'' key,
        then ''volume'' key


        In many cases the ''volume'' key in connection_properties can be used to

        figure out the StorPool volume that os-brick needs to work on.


        In some cases though the volume key does not contain the needed ID. For

        example, when migrating a volume attached to a running instance between

        storage pools on the same backend, after Nova performs a volume swap,

        Cinder assigns the ID of the old volume to the new volume and the ID of

        the new volume gets discarded. However, the ''volume'' key in the

        attachment info stores this new ID that points to a now nonexistent

        volume. Consecutive migration, hard reboot, stop/start, detach, and

        extend on the volume fails because volume operations try to lookup a

        volume that does not exist.


        Ideally only volume_id should be used, but a follow-up change is

        required to also populate the volume_id in connection_properties from

        Cinder. For now, try using ''volume_id'' and if there is none, use

        ''volume''.


        The root cause analysis and release note wording was done with

        Claude Code; the fix and test were written manually.


        Assisted-By: Claude Code (Claude Fable 5.1)

        Change-Id: I6b89558cc147734262770a641e948f8903982eaa

        Signed-off-by: Biser Milanov <biser.milanov@storpool.com>

        '
