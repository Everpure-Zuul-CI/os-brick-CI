      change_message: 'Rename the key "system uuid" to "system_uuid"


        It is done for easier usage and avoid checking the non-conventional

        ''space'' and replace it with ''underscore''.


        The connector properties dictionary is built by os-brick on the

        compute node, so Cinder keeps seeing the legacy key from any compute

        that still runs an older os-brick. The Cinder drivers that consume

        this value (Pure Storage, RSD and Infinidat) accept both spellings

        in the change below, and that change must merge first: without it

        the rename breaks attach for those drivers on master.


