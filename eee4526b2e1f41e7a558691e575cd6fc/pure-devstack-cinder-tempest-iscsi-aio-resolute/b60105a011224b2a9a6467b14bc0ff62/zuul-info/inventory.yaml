      ansible_version: '8'
      attempts: 1
      branch: master
      build: b60105a011224b2a9a6467b14bc0ff62
      buildset: eee4526b2e1f41e7a558691e575cd6fc
      change: '1013359'
      change_message: 'iSCSI: return a stable path for multipath volumes


        _get_connect_result() returns ''/dev/'' + mpath for a multipathed volume,

        which is a device mapper name such as /dev/dm-182.  A dm-N name is only

        valid while the map keeps that minor: multipathd reassigns minors when it

        reloads a map, and udev and kpartx then take the freed ones for other

        maps, including the partition maps that kpartx creates for every

        multipath device.  The name handed to the caller can therefore open a

        different volume, or a partition of one, by the time it is used.


        Nova stores the returned path verbatim in connection_info and writes it

        into the libvirt domain XML as the disk source, so the stale name is

        persisted and reused by any later start that does not go through a fresh

        connect_volume(), such as a resume from suspend.  Seen in the field on a

        compute node where a hard reboot of an instance with 13 iSCSI volumes

        left 8 of them pointing at the partition map of a different LUN.


        Return the /dev/disk/by-id/dm-uuid-mpath-<WWN> symlink instead, which is

        what the Fibre Channel connector already does through

        _discover_mpath_device().  The symlink is keyed on the volume WWID, so it

        follows the map when the minor changes.  Keep the dm-N name as a fallback

        for the case where the symlink is not there yet, so a host that has not

        seen it created keeps the previous behaviour.


        Closes-Bug: #2172628

        Change-Id: I8c483e3347e0f70bab9152c97c0b695ea3385acc

        Signed-off-by: Roy Zuo <roy.zuo@canonical.com>

        '
